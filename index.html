<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assignment Submission Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1a1c29, #0e1017);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #e2e8f0;
    }

    .form-container {
      background: rgba(22, 27, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.05);
      width: 100%;
      max-width: 480px;
    }

    .form-container h2 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .form-container p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-weight: 500;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group select,
    .form-group input[type="file"] {
      width: 100%;
      padding: 13px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 14px;
      color: #f8fafc;
      transition: all 0.25s ease;
    }

    .form-group select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c38bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 16px;
    }

    .form-group select option {
      background: #0f172a;
      color: #f8fafc;
    }

    .form-group input[type="text"]::placeholder,
    .form-group input[type="email"]::placeholder {
      color: #64748b;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background: rgba(15, 23, 42, 0.9);
    }

    .form-group input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    .form-group input[type="file"]::file-selector-button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .form-group input[type="file"]::file-selector-button:hover {
      background: #334155;
      color: #ffffff;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      margin-top: 10px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #status-msg {
      margin-top: 18px;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
      min-height: 20px;
    }

    .success { color: #4ade80; }
    .error { color: #f87171; }
    .loading { color: #38bdf8; }
  </style>
</head>

    <div id="status-msg" aria-live="polite"></div>

  <script>
    const WEBHOOK_URL = "https://n8n.srv1592446.hstgr.cloud/webhook/73df8436-4a63-4590-b553-72b89f142d4e";

    const btn = document.getElementById("btn");
    const status = document.getElementById("status-msg");
    const form = document.getElementById("assignmentForm");
    const fileInput = document.getElementById("zipFile");

    fileInput.addEventListener("change", function () {
      const file = fileInput.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      const allowedExtensions = [".zip", ".rar", ".7z"];
      const valid = allowedExtensions.some(ext => fileName.endsWith(ext));

      if (!valid) {
        status.innerText = "❌ Please upload a ZIP, RAR, or 7Z file.";
        status.className = "error";
        fileInput.value = "";
        return;
      }

      status.innerText = "";
      status.className = "";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      status.innerText = "";
      status.className = "";

      const file = fileInput.files[0];
      if (!file) {
        status.innerText = "❌ Please select your assignment file.";
        status.className = "error";
        return;
      }

      btn.innerText = "Uploading... Please wait";
      btn.disabled = true;
      btn.style.pointerEvents = "none";

      status.innerText = "⏳ Uploading assignment...";
      status.className = "loading";

      const formData = new FormData();
      formData.append("name", document.getElementById("name").value.trim());
      formData.append("rollNo", document.getElementById("rollNo").value);
      formData.append("email", document.getElementById("email").value.trim());
      formData.append("assignmentNo", document.getElementById("assignmentNo").value);
      formData.append("data", file);

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        status.innerText = "✨ Assignment submitted successfully!";
        status.className = "success";
        form.reset();
        btn.innerText = "Submitted ✓";

        setTimeout(function () {
          btn.innerText = "Submit Assignment";
          btn.disabled = false;
          btn.style.pointerEvents = "auto";
        }, 2000);

      } catch (err) {
        console.error("Assignment submission error:", err);
        status.innerText = "❌ Assignment submission failed. Please try again.";
        status.className = "error";

        btn.innerText = "Try Again";
        btn.disabled = false;
        btn.style.pointerEvents = "auto";
      }
    });
  </script>

</html>
